name: Build

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - name: Build
        run: ./gradlew build

      - name: Verify sample
        working-directory: sample
        run: ../gradlew :app-success:verifyTransitiveDependencies

      - name: Verify sample detects transitive dependencies
        working-directory: sample
        run: |
          if ../gradlew :app-transitive-error:verifyTransitiveDependencies; then
            echo "::error::推移的依存によるバージョン変更を検知できていません"
            exit 1
          fi
          grep -q "Transitive Dependencies Detected: com.squareup.okio:okio:3.0.0" app-transitive-error/build/reports/transitive-dependencies/report.txt
